# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

repos:
  # You can add your own recipes to the project by uncommenting these lines and adding
  # the appropriate bitbake files
  #project:
  #  layers:
  #    yocto/meta-project:

  meta-foundries:
    url: https://github.com/foundriesio/meta-foundries
    branch: wrynose

local_conf_header:
  ci: |
    BB_SIGNATURE_HANDLER = "OEBasicHash"
    SOTA_SKIP_CRED_WARN = "1"

  rm-work: |
    # Keep around foundries projects to enable quick rebuilds
    RM_WORK_EXCLUDE += "fioconfig aktualizr-lite composectl fio-device-register"

  update-server: |
    # Set default URLS into fio-device-register to improve its easy of use
    FIO_DEVICE_API = "https://TODO/v1/devices"
    FIO_OAUTH_API = "https://TODO/oauth2"

  packages:
    IMAGE_INSTALL:append = " sudo"
