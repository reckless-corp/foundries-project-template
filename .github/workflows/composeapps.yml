name: Build ComposeApps

on:
  workflow_call:
    inputs:
      archive:
        required: true
        type: string

permissions:
  contents: read

jobs:
  composeapps:
    name: Build ComposeApps
    runs-on: [self-hosted, Linux, X64]
    env:
      ARCHIVE: ${{ inputs.archive }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Archive
        run: |
          set -ex
          mkdir -p "${ARCHIVE}"
