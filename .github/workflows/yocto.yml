name: Build Yocto

on:
  workflow_call:
    inputs:
      archive:
        required: true
        type: string
      kas_cache:
        required: true
        type: string
      kas_container:
        required: true
        type: string

permissions:
  contents: read

jobs:
  yocto:
    name: Build Yocto
    runs-on: [self-hosted, Linux, X64, yocto]
    env:
      ARCHIVE: ${{ inputs.archive }}
      KAS_CACHE: ${{ inputs.kas_cache }}
      KAS_CONTAINER: ${{ inputs.kas_container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Archive
        run: |
          set -ex
          mkdir -p "${ARCHIVE}"
