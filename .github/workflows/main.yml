name: ci-main

on:
  push:
    branches:
      - main

permissions:
  packages: write

env:
  ARCHIVE: /var/code/reckless-corp/storage/archive
  KAS_CACHE: /var/code/reckless-corp/storage/kas
  KAS_CONTAINER: /var/code/reckless-corp/storage/kas/kas-container

jobs:
  yocto:
    name: Yocto ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64, yocto]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: intel-corei7-64
            artifacts: >-
              core-image-full-cmdline-intel-corei7-64.rootfs.spdx.json
              core-image-full-cmdline-intel-corei7-64.rootfs.wic.zst
              core-image-full-cmdline-intel-corei7-64.rootfs.wic.qcow2
              ovmf*
          - name: uno-q
            artifacts: >-
              core-image-full-cmdline-uno-q.rootfs.qcomflash
              core-image-full-cmdline-uno-q.rootfs.spdx.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Kas Setup
        run: |
          set -ex
          if [ ! -x "${KAS_CONTAINER}" ] ; then
            wget -O ${KAS_CONTAINER} https://raw.githubusercontent.com/siemens/kas/refs/tags/5.5/kas-container
            chmod +x "${KAS_CONTAINER}"
          fi

      - name: Kas Build
        run: |
          set -ex

          cd yocto

          export DL_DIR=${KAS_CACHE}/downloads
          export SSTATE_DIR=${KAS_CACHE}/sstate-cache
          export KAS_WORK_DIR=`pwd`/.kas-work
          mkdir -p ${KAS_WORK_DIR}/build/conf ${DL_DIR} ${SSTATE_DIR}

          ${KAS_CONTAINER} build ${{ matrix.name }}.yml

      - name: Archive
        run: |
          set -ex
          archive="${ARCHIVE}/${{ github.event.repository.name }}/${GITHUB_SHA}/${{ matrix.name }}"
          mkdir -p "${archive}"

          cd yocto/.kas-work/build/tmp/deploy/images/${{ matrix.name }}
          ls
          tar -czf "${archive}/ostree_repo.tgz" ostree_repo
          cp -rL ${{ matrix.artifacts }} "${archive}/"

  containers:
    name: Containers ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: true
      matrix:
        docker_dir:
          - matrix

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set short git commit SHA
        id: tag
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "short_sha=$calculatedSha" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          context: "{{ defaultContext }}:containers/${{ matrix.docker_dir }}"
          tags: "ghcr.io/${{ github.repository_owner }}/${{ matrix.docker_dir }}:${{ steps.tag.outputs.short_sha }}"

      - name: Save pinned image URI
        run: |
          mkdir -p pinned
          echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.docker_dir }}@${{ steps.docker_build.outputs.digest }}" > "pinned/${{ matrix.docker_dir }}"
      - name: Upload pinned image URI
        uses: actions/upload-artifact@v7
        with:
          name: pinned-${{ matrix.docker_dir }}
          path: pinned
          if-no-files-found: error

  apps:
    needs: containers
    runs-on: [self-hosted, Linux, X64]
    container:
      image: foundries/lmp-app-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: matrix
            images: matrix
            platforms: amd64,arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned image URIs
        uses: actions/download-artifact@v4
        with:
          pattern: pinned-*
          path: pinned
          merge-multiple: true

      - name: Build and push app
        id: build
        working-directory: containers/${{ matrix.app }}
        run: |
          set -x
          tag="${{ github.run_number }}_${{ needs.build-images.outputs.image_tag }}"
          pinned_args=""
          uris=""
          for img in ${{ matrix.images }} ; do
            uri="$(cat ../../pinned/${img})"
            uris="${uris:+${uris},}${uri}"
          done
          if [ -n "${uris}" ] ; then
            pinned_args="--pinned-images ${uris}"
          fi
          composectl publish -d app.hash ${pinned_args} ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}-app:${tag} ${{ matrix.platforms }}
          uri="ghcr.io/${{ github.repository_owner}}/${{ matrix.app }}-app@$(cat app.hash)"
          mkdir -p ../app-uris
          echo "${uri}" > "../app-uris/${{ matrix.app }}"

      - name: Upload app URI
        uses: actions/upload-artifact@v7
        with:
          name: app-uri-${{ matrix.app }}
          path: containers/app-uris
          if-no-files-found: error

  archive:
    needs: [yocto, containers, apps]
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download app URIs
        uses: actions/download-artifact@v4
        with:
          pattern: app-uri-*
          path: app-uris
          merge-multiple: true

      - name: Download apps
        run: |
          set -x

          wget -O /tmp/composectl https://github.com/foundriesio/composeapp/releases/download/v96.3.0/composectl_96.3.0_linux_amd64
          chmod +x /tmp/composectl

          archive="${ARCHIVE}/${{ github.event.repository.name }}/${GITHUB_SHA}/apps"
          mkdir -p ${archive}
          echo "${{ github.run_number }}" > ${archive}/version
          for f in app-uris/* ; do
            uri="$(cat "${f}")"
            /tmp/composectl pull -i ${archive} -s ${archive} "${uri}"
          done

      - name: Archive
        run: |
          set -ex
          number="${{ github.run_number }}"

          mv ${ARCHIVE}/${{ github.event.repository.name }}/${GITHUB_SHA} ${ARCHIVE}/${{ github.event.repository.name }}/${number}_${GITHUB_SHA}
